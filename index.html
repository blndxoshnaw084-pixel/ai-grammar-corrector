<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Grammar Corrector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom loading animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-6 md:p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">AI Grammar Corrector</h1>
        <p class="text-gray-600 mb-6">Enter a paragraph below, and our AI will correct any grammar, spelling, or punctuation mistakes.</p>

        <textarea id="inputText" rows="5" class="w-full border border-gray-300 rounded-lg p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm resize-none" placeholder="Type or paste your text here..."></textarea>

        <div class="mt-4 flex justify-between items-center">
            <button id="clearBtn" class="text-gray-500 hover:text-red-500 transition font-medium">Clear Text</button>
            <button id="correctBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition flex items-center gap-2">
                <span>Correct Grammar</span>
                <div id="loadingSpinner" class="loader hidden"></div>
            </button>
        </div>

        <div id="errorBox" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm border border-red-200"></div>

        <div id="resultContainer" class="hidden mt-8 border-t border-gray-200 pt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Results</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-gray-100 p-4 rounded-lg border border-gray-200">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Original Text</h3>
                    <p id="originalDisplay" class="text-gray-700 text-sm whitespace-pre-wrap"></p>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 relative">
                    <h3 class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2">Corrected Text</h3>
                    <p id="correctedDisplay" class="text-gray-800 text-sm whitespace-pre-wrap"></p>
                    
                    <button id="copyBtn" class="absolute top-3 right-3 text-blue-500 hover:text-blue-700 transition" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
