<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Grammar Corrector Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { transition: background-color 0.3s, color 0.3s; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen font-sans">

    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-50 dark:bg-gray-900 transition-opacity duration-500">
        <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 text-center mx-4 border border-gray-100 dark:border-gray-700">
            <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </div>
            <h1 class="text-3xl font-bold mb-2">Grammar Pro</h1>
            <p id="loginStatus" class="text-gray-500 dark:text-gray-400 mb-6 font-medium">Login or Register to start</p>
            <input type="text" id="userNameInput" placeholder="Username" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none transition mb-3 text-center">
            <input type="password" id="userPassInput" placeholder="Password" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none transition mb-6 text-center">
            <button id="enterAppBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-blue-500/30">Enter Dashboard</button>
        </div>
    </div>

    <div id="appScreen" class="hidden flex flex-col md:flex-row min-h-screen">
        <aside class="w-full md:w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col h-auto md:h-screen sticky top-0">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h2 class="text-xl font-bold flex items-center gap-2">History</h2>
                <button id="clearHistoryBtn" class="text-sm text-red-500 hover:text-red-700 transition">Clear</button>
            </div>
            <div id="historyContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
                <p class="text-sm text-gray-400 text-center mt-4" id="emptyHistoryMsg">No recent history.</p>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            <header class="bg-white dark:bg-gray-800 shadow-sm p-4 px-8 flex justify-between items-center z-10 sticky top-0">
                <div>
                    <h2 class="text-2xl font-bold" id="welcomeMessage">Welcome!</h2>
                </div>
                <div class="flex items-center gap-4">
                    <button id="themeToggle" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700">
                        <svg id="sunIcon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 2.32a1 1 0 011.415 0l.708.707a1 1 0 01-1.414 1.414l-.708-.707a1 1 0 010-1.414zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-2.32 4.22a1 1 0 010 1.415l-.707.708a1 1 0 01-1.414-1.414l.707-.708a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-2.32a1 1 0 01-1.415 0l-.708-.707a1 1 0 011.414-1.414l.708.707a1 1 0 010 1.414zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm2.32-4.22a1 1 0 010-1.415l.707-.708a1 1 0 011.414 1.414l-.707.708a1 1 0 01-1.414 0zM10 4a6 6 0 100 12 6 6 0 000-12z"></path></svg>
                        <svg id="moonIcon" class="w-5 h-5 text-gray-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>
                    <button id="logoutBtn" class="text-sm font-medium text-gray-500 hover:text-red-500 transition">Logout</button>
                </div>
            </header>

            <div class="max-w-4xl w-full mx-auto p-6 flex-1">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 mb-6">
                    <textarea id="inputText" rows="6" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-4 focus:ring-2 focus:ring-blue-500 outline-none transition text-lg" placeholder="Enter text here..."></textarea>
                    <div class="mt-4 flex justify-between items-center">
                        <button id="clearBtn" class="text-gray-500 hover:text-red-500 transition font-medium">Clear</button>
                        <button id="correctBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition flex items-center gap-2">
                            <span>Correct Grammar</span>
                            <div id="loadingSpinner" class="loader hidden"></div>
                        </button>
                    </div>
                </div>
                <div id="errorBox" class="hidden mb-6 p-4 bg-red-100 text-red-700 rounded-lg border border-red-200"></div>
                <div id="resultContainer" class="hidden">
                    <div class="bg-blue-50 dark:bg-blue-900/20 p-6 rounded-xl border border-blue-200 dark:border-blue-800 relative">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-sm font-bold text-blue-600 uppercase">Corrected Output</h3>
                            <button id="copyBtn" class="text-blue-500 hover:text-blue-700 flex items-center gap-1 text-sm font-medium bg-white dark:bg-gray-800 px-3 py-1 rounded shadow-sm">Copy</button>
                        </div>
                        <p id="correctedDisplay" class="text-gray-800 dark:text-gray-200 text-lg whitespace-pre-wrap"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
